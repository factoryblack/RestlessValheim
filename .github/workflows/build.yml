# Compile on every PR / push. Ship GitHub + Thunderstore only when you tag:
#   v*      RestlessCore + Restless Valheim (modpack). Cook/Piles compiled, not published.
#   pack-v* Restless Valheim pack only
#   cook-v* RestlessCook only
#   piles-v* RestlessPiles only
#   plant-v* RestlessPlant only
# GitHub runners have no Valheim client, so this follows Jötunn's pattern:
# SteamCMD anonymous dedicated server (app 896660) + BepInEx pack, cached by buildid.
# Thunderstore publish needs repo secret TCLI_AUTH_TOKEN (never commit the token).

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'pack-v*', 'cook-v*', 'piles-v*', 'plant-v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BEPINEX_PACK: 5.4.2350
  JOTUNN: 2.30.1
  VHINSTALL: /home/runner/VHINSTALL

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valheim dedicated-server buildid
        id: valheim
        run: |
          buildid=$(curl -fsSL https://api.steamcmd.net/v1/info/896660 | jq -r '.data."896660".depots.branches.public.buildid')
          if [ -z "$buildid" ] || [ "$buildid" = "null" ]; then
            echo "steamcmd.net did not return a buildid" >&2
            exit 1
          fi
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Cache Valheim + BepInEx
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VHINSTALL }}
          key: vh-${{ steps.valheim.outputs.buildid }}-bep-${{ env.BEPINEX_PACK }}-jotunn-${{ env.JOTUNN }}

      - uses: CyberAndrii/setup-steamcmd@v1
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Install dedicated server + BepInEx
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget -q -O bepinex.zip "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/${BEPINEX_PACK}/"
          unzip -q bepinex.zip -d "$HOME/BepInExRaw"
          steamcmd +force_install_dir "$VHINSTALL" +login anonymous +app_info_update 1 +app_update 896660 validate +exit
          mv "$VHINSTALL/valheim_server_Data" "$VHINSTALL/Valheim_Data"
          ln -sfn Valheim_Data "$VHINSTALL/valheim_Data"
          mv "$HOME/BepInExRaw/BepInExPack_Valheim/"* "$VHINSTALL/"
          rm -rf "$VHINSTALL/Valheim_Data/Managed/publicized_assemblies"
          test -f "$VHINSTALL/Valheim_Data/Managed/assembly_valheim.dll"

      - name: Point MSBuild at the cached install
        run: |
          cat > Environment.props <<EOF
          <Project>
            <PropertyGroup>
              <ValheimInstall>${VHINSTALL}</ValheimInstall>
              <VALHEIM_INSTALL>${VHINSTALL}</VALHEIM_INSTALL>
              <BEPINEX_PATH>${VHINSTALL}/BepInEx</BEPINEX_PATH>
            </PropertyGroup>
          </Project>
          EOF

      - name: Release build
        run: |
          dotnet build src/RestlessQoL/RestlessQoL.csproj -c Release --nologo
          dotnet build src/RestlessCook/RestlessCook.csproj -c Release --nologo
          dotnet build src/RestlessPiles/RestlessPiles.csproj -c Release --nologo
          dotnet build src/RestlessPlant/RestlessPlant.csproj -c Release --nologo

      - name: Upload RestlessCore.dll
        uses: actions/upload-artifact@v4
        with:
          name: RestlessCore-${{ github.sha }}
          path: dist/RestlessCore.dll
          if-no-files-found: error

      - name: Upload RestlessCook.dll
        uses: actions/upload-artifact@v4
        with:
          name: RestlessCook-${{ github.sha }}
          path: dist/RestlessCook.dll
          if-no-files-found: error

      - name: Upload RestlessPiles.dll
        uses: actions/upload-artifact@v4
        with:
          name: RestlessPiles-${{ github.sha }}
          path: dist/RestlessPiles.dll
          if-no-files-found: error

      - name: Upload RestlessPlant.dll
        uses: actions/upload-artifact@v4
        with:
          name: RestlessPlant-${{ github.sha }}
          path: dist/RestlessPlant.dll
          if-no-files-found: error

      - name: Stamp package versions from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re, json
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          cook_toml = Path("thunderstore/cook/thunderstore.toml")
          cook_ver = re.search(r'versionNumber = "(.*)"', cook_toml.read_text(encoding="utf-8")).group(1)

          def stamp_toml(path, version_number=None, core=None, cook=None):
              text = path.read_text(encoding="utf-8")
              if version_number:
                  text = re.sub(r'versionNumber = ".*"', f'versionNumber = "{version_number}"', text, count=1)
              if core:
                  text = re.sub(r'Restless-RestlessCore = ".*"', f'Restless-RestlessCore = "{core}"', text, count=1)
              if cook:
                  text = re.sub(r'Restless-RestlessCook = ".*"', f'Restless-RestlessCook = "{cook}"', text, count=1)
              path.write_text(text, encoding="utf-8")

          def stamp_manifest(path, version_number=None, core=None, cook=None):
              data = json.loads(path.read_text(encoding="utf-8"))
              if version_number:
                  data["version_number"] = version_number
              deps = data.get("dependencies") or []
              if core:
                  deps = [f"Restless-RestlessCore-{core}" if d.startswith("Restless-RestlessCore-") else d for d in deps]
              if cook:
                  deps = [f"Restless-RestlessCook-{cook}" if d.startswith("Restless-RestlessCook-") else d for d in deps]
              data["dependencies"] = deps
              path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          stamp_toml(Path("thunderstore/plugin/thunderstore.toml"), version_number=version)
          stamp_manifest(Path("thunderstore/plugin/manifest.json"), version_number=version)
          stamp_toml(Path("thunderstore/pack/thunderstore.toml"), version_number=version, core=version, cook=cook_ver)
          stamp_manifest(Path("thunderstore/pack/manifest.json"), version_number=version, core=version, cook=cook_ver)
          print(f"stamped core/pack {version}, pack still depends on cook {cook_ver}")
          PY

      - name: Thunderstore zips
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -f thunderstore/icon.png
          test -f thunderstore/pack/icon.png
          test -f dist/RestlessCore.dll
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool install -g tcli
          tcli build --config-path thunderstore/plugin/thunderstore.toml --package-version "$version"
          tcli build --config-path thunderstore/pack/thunderstore.toml --package-version "$version"

      - name: Publish to Thunderstore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "Add a repo secret named TCLI_AUTH_TOKEN (Thunderstore team service account)." >&2
            exit 1
          fi
          export PATH="$HOME/.dotnet/tools:$PATH"
          plugin_zip=$(ls artifacts/tcli-plugin/*.zip | head -n 1)
          pack_zip=$(ls artifacts/tcli-pack/*.zip | head -n 1)
          tcli publish --config-path thunderstore/plugin/thunderstore.toml --file "$plugin_zip"
          publish_after() {
            local cfg="$1" file="$2" label="$3"
            for attempt in 1 2 3 4 5; do
              tcli publish --config-path "$cfg" --file "$file" && return 0
              if [ "$attempt" -eq 5 ]; then
                echo "$label publish failed after upstream upload" >&2
                return 1
              fi
              sleep 15
            done
          }
          publish_after thunderstore/pack/thunderstore.toml "$pack_zip" pack

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/RestlessCore.dll
            artifacts/tcli-plugin/*.zip
            artifacts/tcli-pack/*.zip

      - name: Stamp pack package version from tag
        if: startsWith(github.ref, 'refs/tags/pack-v')
        run: |
          version="${GITHUB_REF_NAME#pack-v}"
          echo "version=$version" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re, json
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("pack-v")
          toml = Path("thunderstore/pack/thunderstore.toml")
          text = toml.read_text(encoding="utf-8")
          text = re.sub(r'versionNumber = ".*"', f'versionNumber = "{version}"', text, count=1)
          toml.write_text(text, encoding="utf-8")
          manifest = Path("thunderstore/pack/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version_number"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"stamped pack {version}")
          PY

      - name: Thunderstore pack zip
        if: startsWith(github.ref, 'refs/tags/pack-v')
        run: |
          test -f thunderstore/pack/icon.png
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool install -g tcli
          tcli build --config-path thunderstore/pack/thunderstore.toml --package-version "$version"

      - name: Publish pack to Thunderstore
        if: startsWith(github.ref, 'refs/tags/pack-v')
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "Add a repo secret named TCLI_AUTH_TOKEN (Thunderstore team service account)." >&2
            exit 1
          fi
          export PATH="$HOME/.dotnet/tools:$PATH"
          pack_zip=$(ls artifacts/tcli-pack/*.zip | head -n 1)
          tcli publish --config-path thunderstore/pack/thunderstore.toml --file "$pack_zip"

      - name: GitHub Release pack
        if: startsWith(github.ref, 'refs/tags/pack-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/tcli-pack/*.zip

      - name: Stamp cook package version from tag
        if: startsWith(github.ref, 'refs/tags/cook-v')
        run: |
          version="${GITHUB_REF_NAME#cook-v}"
          echo "version=$version" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re, json
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("cook-v")
          toml = Path("thunderstore/cook/thunderstore.toml")
          text = toml.read_text(encoding="utf-8")
          text = re.sub(r'versionNumber = ".*"', f'versionNumber = "{version}"', text, count=1)
          toml.write_text(text, encoding="utf-8")
          manifest = Path("thunderstore/cook/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version_number"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"stamped cook {version}")
          PY

      - name: Thunderstore cook zip
        if: startsWith(github.ref, 'refs/tags/cook-v')
        run: |
          test -f thunderstore/cook/icon.png
          test -f dist/RestlessCook.dll
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool install -g tcli
          tcli build --config-path thunderstore/cook/thunderstore.toml --package-version "$version"

      - name: Publish cook to Thunderstore
        if: startsWith(github.ref, 'refs/tags/cook-v')
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "Add a repo secret named TCLI_AUTH_TOKEN (Thunderstore team service account)." >&2
            exit 1
          fi
          export PATH="$HOME/.dotnet/tools:$PATH"
          cook_zip=$(ls artifacts/tcli-cook/*.zip | head -n 1)
          tcli publish --config-path thunderstore/cook/thunderstore.toml --file "$cook_zip"

      - name: GitHub Release cook
        if: startsWith(github.ref, 'refs/tags/cook-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/RestlessCook.dll
            artifacts/tcli-cook/*.zip

      - name: Stamp piles package version from tag
        if: startsWith(github.ref, 'refs/tags/piles-v')
        run: |
          version="${GITHUB_REF_NAME#piles-v}"
          echo "version=$version" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re, json
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("piles-v")
          toml = Path("thunderstore/piles/thunderstore.toml")
          text = toml.read_text(encoding="utf-8")
          text = re.sub(r'versionNumber = ".*"', f'versionNumber = "{version}"', text, count=1)
          toml.write_text(text, encoding="utf-8")
          manifest = Path("thunderstore/piles/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version_number"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"stamped piles {version}")
          PY

      - name: Thunderstore piles zip
        if: startsWith(github.ref, 'refs/tags/piles-v')
        run: |
          test -f thunderstore/piles/icon.png
          test -f dist/RestlessPiles.dll
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool install -g tcli
          tcli build --config-path thunderstore/piles/thunderstore.toml --package-version "$version"

      - name: Publish piles to Thunderstore
        if: startsWith(github.ref, 'refs/tags/piles-v')
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "Add a repo secret named TCLI_AUTH_TOKEN (Thunderstore team service account)." >&2
            exit 1
          fi
          export PATH="$HOME/.dotnet/tools:$PATH"
          piles_zip=$(ls artifacts/tcli-piles/*.zip | head -n 1)
          tcli publish --config-path thunderstore/piles/thunderstore.toml --file "$piles_zip"

      - name: GitHub Release piles
        if: startsWith(github.ref, 'refs/tags/piles-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/RestlessPiles.dll
            artifacts/tcli-piles/*.zip

      - name: Stamp plant package version from tag
        if: startsWith(github.ref, 'refs/tags/plant-v')
        run: |
          version="${GITHUB_REF_NAME#plant-v}"
          echo "version=$version" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, re, json
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("plant-v")
          toml = Path("thunderstore/plant/thunderstore.toml")
          text = toml.read_text(encoding="utf-8")
          text = re.sub(r'versionNumber = ".*"', f'versionNumber = "{version}"', text, count=1)
          toml.write_text(text, encoding="utf-8")
          manifest = Path("thunderstore/plant/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version_number"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"stamped plant {version}")
          PY

      - name: Thunderstore plant zip
        if: startsWith(github.ref, 'refs/tags/plant-v')
        run: |
          test -f thunderstore/plant/icon.png
          test -f dist/RestlessPlant.dll
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet tool install -g tcli
          tcli build --config-path thunderstore/plant/thunderstore.toml --package-version "$version"

      - name: Publish plant to Thunderstore
        if: startsWith(github.ref, 'refs/tags/plant-v')
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "Add a repo secret named TCLI_AUTH_TOKEN (Thunderstore team service account)." >&2
            exit 1
          fi
          export PATH="$HOME/.dotnet/tools:$PATH"
          plant_zip=$(ls artifacts/tcli-plant/*.zip | head -n 1)
          tcli publish --config-path thunderstore/plant/thunderstore.toml --file "$plant_zip"

      - name: GitHub Release plant
        if: startsWith(github.ref, 'refs/tags/plant-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/RestlessPlant.dll
            artifacts/tcli-plant/*.zip
