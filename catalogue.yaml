  # --- bite 1, in the DLL ---
  - id: storage.craft
    name: Craft from nearby chests
    decision: dll
    in_mod: done
    bite: 1
    restless: Azumatt-AzuCraftyBoxes
    note: "Clients count every nearby chest. Spend is local if this peer already owns the ZDO, else RestlessPull to the current owner (same routing as vanilla stack/take-all). Quality/world-level follow CountItems. Recipe rows show have/need (bag plus spendable chest stock; LeaveOne is reserved per chest in both the have-count and the pull). A 1-cost ingredient no longer stays craftable after the last spendable unit is gone. HaveRequirements only flips true for chest stock when the current bench already meets GetRequiredStationLevel — a too-low forge used to allow upgrades. Craft shortfall is optimistic. Playtest a joining client at a closed chest."

  - id: storage.build
    name: Build from nearby chests
    decision: dll
    in_mod: done
    bite: 1
    restless: Azumatt-AzuCraftyBoxes
    note: "Same RestlessPull as storage.craft, including LeaveOne reservation in the have-count. Ghosts still skipped. Chest stock never flips RequirementMode.IsKnown (hammer and feast discovery stay vanilla). Playtest a joining client placing a piece from closed chests."

  - id: storage.quickstack
    name: Quick stack (`)
    decision: dll
    in_mod: done
    bite: 1
    restless: Azumatt-AzuAutoStore
    note: "Match-only. Local write if we own the chest, else RestlessPush and only then shrink the bag. Skips hotbar row 0, extras, and locks. No sort/trash."

  - id: storage.restock
    name: Restock (Shift+`)
    decision: dll
    in_mod: done
    bite: 1
    restless: Azumatt-AzuAutoStore
    note: "Existing stacks only; LeaveOne. Pull waits for the owner reply before adding to the bag so a failed RPC cannot dupe. Quality and world-level match the stack being filled. Owner replies taken=0 when storage is off; pending pulls expire after 3s."

  - id: storage.station_pull
    name: Stations pull ore/fuel from chests
    decision: dll
    in_mod: done
    bite: 1
    restless: Azumatt-AzuCraftyBoxes
    note: "Smelter/kiln + cooking + fermenter. Chest pull uses RestlessPull when this peer is not the ZDO owner. Clone comes from the chest row when possible. EnsureDropPrefab fills m_dropPrefab from the conversion or ObjectDB — OnAddOre/CookItem/AddItem read the prefab name and NRE when it is missing (bag clones included). Consume is the RemoveOneItem postfix."

