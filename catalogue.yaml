    name: Restless inventory (Tab)
    decision: dll
    in_mod: partial
    bite: 2
    restless: RandyKnapp-Auga
    note: "Audit pass: reversible native graphic/TMP/renderer/active/CanvasGroup state; dedicated split/variant dialog material pass preserving native inputs and selection. Crafting consumes TooltipApi badges/sections with result-item previews and revision invalidation. See docs/ui-audit-ecosystem.md; compile/runtime checks pending. Idle Tab frames skip paper refresh; stamp still covers stacks, recipes, nearby-storage counts and overlay selection. Compendium/trophies/achievements adopt shared collection shells and card typography; dedicated compendium readers have measured padding, native progress/status copy is preserved and live collection text triggers refresh. See docs/collection-screens.md; compile/playtest pending. Skills dialog adopts shared paper frame/rows, clearer level and bonus labels, restored bar colours and live text/list refresh; see docs/character-skills.md. Container frame now follows real grid/control bounds, with live occupied/total slots, shared Take All/Stack controls and carry-weight artwork. Compact labels share bounded sizing; see docs/ui-consistency-containers.md. Inventory adopts the recessed slot, six empty-equipment silhouettes, narrow durability and quiet hover/focus/equipped states; fitted paper backing with plain hotbar/equipment seams preserves cell coordinates and capacity. Lock remains the top-right diamond. Live quick binds sit clear of counts; weight uses the shared mask. See docs/inventory-integration.md; compile and in-game checks pending. Tab dresser. Forged kit adds 19 runtime assets, category-adjacent quality gems, direct scrolling in an owned inset craft viewport, station medallion/hover and shared navigation/action treatments; see docs/forged-kit.md. Next in-game test pending. First screenshot follow-up adds explicit tooltip quality diamonds, structured craft stats, stale requirement-count cleanup, compact station icons, quieter material rims and capsule Settings switches; see docs/ui-playtest-refinements.md. Crafting uses inventory charcoal paper. Place() was painting RowTint over that face every Sync while PaperSurface early-out left the stone black; skip that retint once paperAccent is on, keep the face cream, and use InventorySurface on the craft body. Amber selected recipes, live requirement counts/shortage colours and reversible button feedback; includes Settings/tooltip foundations. Compile and Unity playtest pending; see docs/crafting-materials.md. Overlay screens (Texts / Skills / Trophies / Achievements) get their own QuietOverlay — darken, wood, panel-back, scroll tracks gone; Mask images ghosted so clipping stays. Compendium rows follow the lore prefab, not SkillElement. Stamp includes the open overlay so picking a text re-dresses. Repair hammer: Hide large leftover plates (do not Ghost a full-size Image). Leftover chrome is playtest. Item inspect is ui.tooltip."

