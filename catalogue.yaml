    decision: skip
    in_mod: n/a
    restless: Azumatt-Hearthstone / RustyMods-KnowledgeTable / Azumatt-RepairStation / Azumatt-ResinGuard
    note: "New items/pieces. Hearthstone and ResinGuard are deprecated."

  - id: skip.currency_pocket
