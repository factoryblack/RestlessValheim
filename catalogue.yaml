  - id: ui.overhaul
    name: Restless inventory / HUD overhaul
    decision: dll
    in_mod: partial
    bite: 3
    restless: RandyKnapp-Auga
    note: "Restless is the QoL+UI core. Language: Strip / Chip / Ink / Tray / TrayHead / TitleTear / Rim / HudRow / HudMeter / Wear / KeyChip / KeyStack / HudTuck. TitleTear may escape a tray top-right; never a roof. Toasts top-left (including first-item / recipe unlocks). Hotbar at Bar. Health left of Bar, stamina right. Action hints at BottomRight. World hover at Look. M map is torn mat + plates (terrain unmasked). Hammer helper above the bar. Hammer menu is ui.build. Guardian + food (empty Eat + food fork) on the buff list. Tab dresser in progress (ui.inventory). Item inspect is ui.tooltip. Loadout totals are ui.sheet. Character counts are player.ledger. ESC pause / logout / exit are ui.menu. Biome-found stays vanilla. Extra armor/quick slots are inventory.equipment_slots. Do not install Auga."

