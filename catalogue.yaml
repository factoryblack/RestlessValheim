# RestlessCore master catalogue
# One row per behaviour. This is the only list.
#
# decision:
#   dll      — belongs in RestlessCore.dll
#   loader   — BepInEx / Jötunn (required to load, not QoL)
#   sidecar  — optional separate mod; only if we still want that product
#   vanilla  — Valheim 1.0 already covers it
#   skip     — will not ship (not QoL, deprecated, or a different game)
# in_mod:
#   n/a     — not a DLL feature
#   none    — decided, no code
#   stub    — module exists, does nothing useful
#   partial — real patch, known holes or never launched
#   done    — patch looks complete. Playtest status lives in the note (not this field).
# bite: 1 papercuts | 2 more of the same | 3 candidate only — not a promised backlog
#
# Do not install AzuCraftyBoxes, AzuAutoStore, AzuAreaRepair, AzuWorkbenchTweaks,
# ValheimPlus, BetterUI, or MinimalUI beside this plugin.
#
# last_audit: 2026-09-23 — Core 0.1.15, Piles 0.1.6, Drawers 0.1.1. Layout dumps follow the Jötunn debug switch. Pile range hides until isolate. Drawer cabinets take a metal/smoothness map.

