    restless: Azumatt-CurrencyPocket
    note: "Noise on top of 1.0 pockets."

  - id: skip.groups_combat
    name: Groups / combat owner
    decision: skip
    in_mod: n/a
    restless: Smoothbrain-Groups / Smoothbrain-CombatOwner
    note: "MP systems, not papercuts. CombatOwner is Jul 2024 / stale."

  - id: skip.balance_worldgen
    name: Steady regen / max dungeon rooms / max player count
    decision: skip
