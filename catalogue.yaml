  - id: inventory.equipment_slots
    name: Dedicated armor / quick slots
    decision: dll
    in_mod: done
    bite: 2
    restless: RandyKnapp-EquipmentAndQuickSlots
    note: "Do not install the sidecar. Hidden rows, relocated worn + Z/X/C. Player.Load / Seat / Wear only on the owned local player — a friend joining used to reset the static height and shuffle extras. FinishDrag deletes leftover only if it is the same instance (not m_shared). WearExtras skipped while m_craftTimer >= 0. Death: extras into a second tomb. Ctrl/Move and Drop skip UnseatWorn so vanilla can take the item — AddItem clones, which used to zero the original stack and make DropItem spawn a second copy on the ground after parking one on hotbar row 0. Unequip parks in the bag, not the hotbar, and skips locks. HUD Z/X/C keep the hotbar held grow; taps fire while sprinting/moving (BepInEx IsDown blocks any extra key). DoCrafting AddItem that targets an extra cell is rewritten to a bag slot so upgrade/craft from a quick slot does not leave the unequipped piece in Z/X/C. Playtest upgrade + a joining client."

