  - id: skip.portals
    name: Portal destination picker / instant loads
    decision: skip
    in_mod: n/a
    restless: Smoothbrain-TargetPortal / OdinPlus-QuickTeleport / OdinPlus-XPortal
    note: "Portal networks stay out. TargetPortal and XPortal are both Feb 2026; XPortal fights ComfyGizmo. QuickTeleport (Nov 2024) makes the world feel cheap."

  - id: skip.farming
    name: Farming grid / farming skill
    decision: skip
    in_mod: n/a
    restless: Smoothbrain-Farming / Advize-PlantEasily
    note: "Skills are progression. PlantEasily-style grid / bulk harvest / replant lives in RestlessPlant, not Core. Grid extras snap to ground height, paint red when they cannot grow, and skip those cells. Separate columns (`[` `]`) and rows (`-` `=`). Snap-to-field (F10) aligns to a nearby plant. Grow-anywhere, extra saplings, decorative flora, and beehive bulk are host-locked settings (grow-anywhere defaults off). Regrow hover on picked pickables and saplings; one-shot hover names the replant piece. Out of this plugin."

  - id: skip.muc
    name: Multi-user chests / ChestButler
    decision: skip
    in_mod: n/a
    restless: MSchmoecker-MultiUserChest / EK_Solutions-ChestButler
    note: "Networking product. NearbyStorage must coexist, not clone it. MUC 0.6.1 is Feb 2025; ChestButler needs MUC."

  - id: skip.backpacks
    name: Backpacks
    decision: skip
    in_mod: n/a
    restless: Smoothbrain-Backpacks
    note: "Try 1.0 pockets first. Bags are a different fantasy, not a papercut."

  - id: skip.skills
    name: Mining / lumber / sailing / smart skills
    decision: skip
    in_mod: n/a
    restless: Smoothbrain-Mining / Lumberjacking / Sailing / SmartSkills
    note: "Progression, not QoL."

  - id: skip.drawers
    name: KG / BROHEIM item drawers
    decision: skip
    in_mod: n/a
    restless: KGvalheim-ItemDrawers / BROHEIM_CYBRP-ItemDrawers
    note: "Do not install those. RestlessDrawers is drawers.chests — chest-equivalent furniture, not a mega-stack drawer."

  - id: drawers.chests
    name: Chest-equivalent drawers
    decision: sidecar
    in_mod: partial
    bite: 2
    restless: Restless-RestlessDrawers
    note: "RestlessDrawers 0.1.1. Wood / personal / reinforced / black metal clone the matching vanilla chest (slots, recipe, privacy, station). One Container per cabinet; fronts show the four most abundant stacks. Snap pitch is the neighbour's visual size minus a 4cm overlap. WearNTear support is skipped (furniture, not studs) and leftover chest AABBs are destroyed so sides do not sit on a phantom grid box. Any tier, same yaw. Lit shader is the chest body, not snow/stack. Surface map is Meshy metal (red) and flipped roughness (alpha) on that shader, so bands can catch light. Hammer icons have the black plate removed. Nearby storage already sees any Container. Not extra capacity. F8 links the Thunderstore page."

  - id: cook.meals
    name: Restless cooking
    decision: sidecar
    in_mod: done
    bite: 2
    restless: Restless-RestlessCook
    note: "RestlessCook 0.1.9. Meals, sideboards, and feasts from Meadows through Ashlands. Needs Core. No F8 settings. Deep North waits. Not in the Core DLL."

  - id: piles.stacks
    name: Uncapped resource piles
    decision: sidecar
    in_mod: done
    bite: 2
    restless: Restless-RestlessPiles
    note: "RestlessPiles 0.1.6. Vanilla wood stacks and stone piles hold what you dump. Take stack, quick-stack, vacuum, and station pull. Nearby range follows Core Search range unless Isolate pile range is on; the F8 slider hides until then. Needs Core 0.1.15. Not a chest."

  - id: plant.forage
    name: Cultivator forage and bushes
    decision: sidecar
    in_mod: done
    bite: 2
    restless: Restless-RestlessPlant
    note: "RestlessPlant 0.1.5. Berry bushes and forage on the cultivator, grid planting, and bulk harvest. The F8 page has the existing planting, harvest, grid, and personal controls. Harvest and snap ranges stay their own settings. Needs Core."

  - id: skip.collectors
    name: Crystal / feather / guck / tar collectors
    decision: skip
    in_mod: n/a
    restless: blacks7ar-CrystalCollector / FeatherCollector / GuckCollector / TarCollector
    note: "Content pieces, not papercuts."

  - id: skip.carts
    name: Crafty carts
    decision: skip
    in_mod: n/a
    restless: OdinPlus-CraftyCartsRemake
    note: "Vehicles / content."

  - id: skip.mylittleui
    name: Timers, multicraft, chest names, craft search
    decision: skip
    in_mod: n/a
    restless: shudnal-MyLittleUI
    note: "Still skip the product. Do not pull MyLittleUI. Clock lives on ui.minimap; station remaining time lives on ui.look. Do not rewrite multicraft, chest names, craft search, or forecast widgets."

  - id: skip.ui_overhaul
    name: BetterUI / MinimalUI / Auga / ValheimPlus
    decision: skip
    in_mod: n/a
    restless: BetterUI_ForeverMaintained / Azumatt-Minimal_UI / RandyKnapp-Auga / Grantapher-ValheimPlus_Grantapher_Temporary
    note: "Patch the same inventory/build/HUD surfaces as us. Auga last TS upload 1.3.11 (Nov 2023); PR 243 (Apr 2026) is a Unity 6 compile resurrection, not a 1.0 port. V+ 10.0.2 is 1.0-day but a kitchen sink — do not mix."

  - id: skip.admin
    name: Server Devcommands
    decision: skip
    in_mod: n/a
    restless: JereKuusela-Server_devcommands
    note: "Admin console (1.110.0, 10 Sep 2026). Use it on the host if you want; not in this plugin."

  - id: skip.map_share
    name: Shared map exploration
    decision: skip
    in_mod: n/a
    restless: Mydayyy-ServerSideMap
    note: "Co-op fog-of-war / shared pins. Not player dots (map.player_dots)."

  - id: skip.gizmo
    name: Build rotation gizmo
