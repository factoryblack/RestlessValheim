[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessCook"
versionNumber = "0.3.2"
description = "Cook the haul, make meals and serve feasts. Plan kitchen orders at one table while nearby cooking stations do the work."
websiteUrl = "https://github.com/factoryblack/RestlessValheim/blob/main/docs/player/cook.md"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"
Restless-RestlessCore = "0.2.3"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-cook"

[[build.copy]]
source = "../../dist/RestlessCook.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../art/cook/runtime"
target = "mesh"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["crafting", "tweaks", "mods"]

