[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessDrawers"
versionNumber = "0.2.0"
description = "Build modular storage walls with visible contents and the same capacity and unlocks as matching vanilla chests."
websiteUrl = "https://github.com/factoryblack/RestlessValheim/blob/main/docs/player/drawers.md"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"
Restless-RestlessCore = "0.2.7"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-drawers"

[[build.copy]]
source = "../../dist/RestlessDrawers.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../art/drawers/runtime"
target = "mesh"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["building", "tweaks", "mods"]

