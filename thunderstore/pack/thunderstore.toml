[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessCorePack"
versionNumber = "0.1.1"
description = "RestlessCore with BepInEx and Jötunn. Nearby storage, extra slots, host-locked settings, and a Restless interface still landing."
websiteUrl = "https://github.com/factoryblack/RestlessValheim"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"
ValheimModding-Jotunn = "2.30.0"
Restless-RestlessCore = "0.1.1"

[build]
icon = "../icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-pack"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "tweaks"]
