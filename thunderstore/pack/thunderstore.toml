[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "Restless_Valheim"
versionNumber = "0.1.25"
description = "The Restless collection in one install: a cohesive interface, smoother storage, expanded cooking and easier farming."
websiteUrl = "https://github.com/factoryblack/RestlessValheim/blob/main/docs/player/README.md"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"
Restless-RestlessCore = "0.2.2"
Restless-RestlessCook = "0.3.1"
Restless-RestlessPiles = "0.2.1"
Restless-RestlessPlant = "0.2.1"
Restless-RestlessDrawers = "0.2.0"
Restless-RestlessStorage = "0.2.1"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-pack"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["modpacks"]

