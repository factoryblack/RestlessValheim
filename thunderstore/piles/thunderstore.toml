[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessPiles"
versionNumber = "0.1.4"
description = "Wood stacks and stone piles become uncapped stores. E opens a tray; Take stack grabs one bag stack. Needs RestlessCore."
websiteUrl = "https://github.com/factoryblack/RestlessValheim"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"
ValheimModding-Jotunn = "2.30.2"
Restless-RestlessCore = "0.1.13"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-piles"

[[build.copy]]
source = "../../dist/RestlessPiles.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["tweaks", "misc", "mods"]
