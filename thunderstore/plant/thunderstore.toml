[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessPlant"
versionNumber = "0.1.4"
description = "Berry bushes and forage on the cultivator, plus a planting square, bulk harvest, and replant. Needs RestlessCore."
websiteUrl = "https://github.com/factoryblack/RestlessValheim"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"
ValheimModding-Jotunn = "2.30.2"
Restless-RestlessCore = "0.1.13"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-plant"

[[build.copy]]
source = "../../dist/RestlessPlant.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["misc", "tweaks", "mods"]
