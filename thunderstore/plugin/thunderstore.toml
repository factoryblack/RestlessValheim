[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessCore"
versionNumber = "0.2.4"
description = "A cohesive Valheim interface, nearby-storage crafting, equipment slots and configurable quality-of-life improvements."
websiteUrl = "https://github.com/factoryblack/RestlessValheim/blob/main/docs/player/core.md"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "../icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-plugin"

[[build.copy]]
source = "../../dist/RestlessCore.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "tweaks"]

