[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessCore"
versionNumber = "0.1.6"
description = "Valheim 1.0 QoL: nearby chests for craft, build and stations; extra armor and Z/X/C slots; F8 host-locked settings. HUD and inventory are mid-migration — vanilla and Restless currently mix."
websiteUrl = "https://github.com/factoryblack/RestlessValheim"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"
ValheimModding-Jotunn = "2.30.1"

[build]
icon = "../icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-plugin"

[[build.copy]]
source = "../../dist/RestlessCore.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "tweaks"]
