[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessStorage"
versionNumber = "0.2.2"
description = "Search nearby storage, see combined item totals and take what you need from the Storekeeper's Table."
websiteUrl = "https://github.com/factoryblack/RestlessValheim/blob/main/docs/player/storage.md"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"
Restless-RestlessCore = "0.2.7"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-storage"

[[build.copy]]
source = "../../dist/RestlessStorage.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../art/storage/runtime"
target = "mesh"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["building", "tweaks", "mods"]

