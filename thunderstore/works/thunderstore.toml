[config]
schemaVersion = "0.0.1"

[package]
namespace = "Restless"
name = "RestlessWorkshop"
versionNumber = "0.1.4"
description = "Manage nearby production from a work-order board. Make a batch or keep essential supplies stocked."
websiteUrl = "https://github.com/factoryblack/RestlessValheim/blob/main/docs/player/works.md"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"
Restless-RestlessCore = "0.2.5"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../artifacts/tcli-works"

[[build.copy]]
source = "../../dist/RestlessWorks.dll"
target = "/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../art/works/runtime"
target = "mesh"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["crafting", "tweaks", "mods"]

