# Single pin list for loaders and Restless packages.
# Feature decisions stay in catalogue.yaml.
# Digits: python scripts/bump-versions.py core=new cook=fix
#   new   — second digit, last digit returns to 0 (something a player can newly do)
#   fix   — last digit only (a correction)
#   break — first digit, and only after 1.0 (a world, config, or join break)
#   done  — 1.0.0, when that package is the finished line
# The pack's last digit moves by itself when a published pack joins a new drop.
# Changelog sentences stay written by hand. sync-versions.py stamps these pins.
# CI runs that stamp with --check so Core cannot keep an old Jötunn.

bepinex: "5.4.2351"
jotunn: "2.30.2"

packages:
  core:
    version: "0.2.1"
    guid: "restless.core"
    thunderstore: "RestlessCore"
    plugin: "src/RestlessQoL/Plugin.cs"
    csproj: "src/RestlessQoL/RestlessQoL.csproj"
    thunderstore_dir: "thunderstore/plugin"
  cook:
    version: "0.3.0"
    guid: "restless.cook"
    thunderstore: "RestlessCook"
    plugin: "src/RestlessCook/Plugin.cs"
    csproj: "src/RestlessCook/RestlessCook.csproj"
    thunderstore_dir: "thunderstore/cook"
    needs_core: true
  piles:
    version: "0.2.0"
    guid: "restless.piles"
    thunderstore: "RestlessPiles"
    plugin: "src/RestlessPiles/Plugin.cs"
    csproj: "src/RestlessPiles/RestlessPiles.csproj"
    thunderstore_dir: "thunderstore/piles"
    needs_core: true
  plant:
    version: "0.2.0"
    guid: "restless.plant"
    thunderstore: "RestlessPlant"
    plugin: "src/RestlessPlant/Plugin.cs"
    csproj: "src/RestlessPlant/RestlessPlant.csproj"
    thunderstore_dir: "thunderstore/plant"
    needs_core: true
  drawers:
    version: "0.1.2"
    guid: "restless.drawers"
    thunderstore: "RestlessDrawers"
    plugin: "src/RestlessDrawers/Plugin.cs"
    csproj: "src/RestlessDrawers/RestlessDrawers.csproj"
    thunderstore_dir: "thunderstore/drawers"
    needs_core: true
  storage:
    version: "0.2.0"
    guid: "restless.storage"
    thunderstore: "RestlessStorage"
    plugin: "src/RestlessStorage/Plugin.cs"
    csproj: "src/RestlessStorage/RestlessStorage.csproj"
    thunderstore_dir: "thunderstore/storage"
    needs_core: true
  pack:
    version: "0.1.24"
    thunderstore: "Restless_Valheim"
    thunderstore_dir: "thunderstore/pack"
    members: [core, cook, piles, plant, drawers, storage]
